
name: Build DeS Unified Weapons

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract clean plugin source
        run: unzip -q DeS-Unified-Weapons-MERGED-CLEAN.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build JAR
        working-directory: DeS-Unified-Weapons/plugin
        run: gradle clean build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DeS-Unified-Weapons-JAR
          path: DeS-Unified-Weapons/plugin/build/libs/*.jar
          if-no-files-found: error
          
